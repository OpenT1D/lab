# Repository tooling only. OpenT1D does not yet have an installable simulator.
[dependency-groups]
dev = [
    "sphinx>=8.2,<9",
    "myst-parser>=5.1.0,<6",
    "furo>=2025.7.19",
    "sphinx-external-toc>=1.0,<2",
    "pymarkdownlnt>=0.9.41,<1",
    "yamllint>=1.37,<2",
    "cffconvert>=2.0,<3",
    "ruff>=0.17.2,<1",
    "sphinxcontrib-mermaid>=1,<3",
]

[tool.uv]
required-version = ">=0.11.16"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
