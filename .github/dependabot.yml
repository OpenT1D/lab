version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    exclude-paths:
      - experiments/**
      - packaging/**
      - tests/**
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      repository-tooling:
        patterns: ['*']
