version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    exclude-paths:
      - experiments/**
      - packaging/**
      - tests/**
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      repository-tooling:
        patterns: ['*']
        update-types: [minor, patch]
