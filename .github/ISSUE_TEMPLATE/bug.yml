name: Bug or scientific correctness
description: Report a software, documentation or scientific problem.
body:
  - type: markdown
    attributes:
      value: >-
        Use SECURITY.md for vulnerabilities. Do not include credentials,
        personal health records or restricted data in this report.
  - type: dropdown
    id: category
    attributes:
      label: Area
      options:
        - Software or tooling
        - Documentation
        - Scientific correctness or model assumptions
        - Reproducibility
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Explain the observed problem and the expected behavior or claim.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction or supporting evidence
      description: >-
        Provide minimal steps and synthetic inputs, or a primary source and the
        affected claim. Include the exact command, observed result and expected
        behavior when possible. Link retained non-sensitive output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Commit, operating system, tool or engine versions and relevant settings.
  - type: textarea
    id: impact
    attributes:
      label: Impact and possible fix
      description: >-
        Identify affected results, components and callers/readers, if known.
        Link an applicable roadmap item; suggest bounded scope and exclusions.
  - type: textarea
    id: contracts
    attributes:
      label: Contracts and acceptance cases
      description: >-
        If known, identify units, timing, source identity, failure accounting,
        baselines/tolerances or compatibility to preserve. Give a success case
        and a counterexample that would expose an incomplete fix.
  - type: textarea
    id: checks
    attributes:
      label: Checks and review handoff
      description: >-
        List checks actually run, outcomes and skips, or say none. Note local
        versus hosted results, unresolved questions and evidence useful to a
        separate reviewer. A software check is not scientific validation.
