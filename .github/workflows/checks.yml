name: Repository checks

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      historical_native:
        description: 'Private archive only: run frozen native locks with known advisories'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    outputs:
      native_enabled: ${{ steps.scope.outputs.native_enabled }}
    name: Root checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.16'
          enable-cache: false
      - name: Install selected Python
        run: uv python install
      - name: Set up required frontend Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install locked repository tooling
        run: |
          mkdir -p results/ci
          TIMEFORMAT='Tooling sync elapsed: %3R seconds'
          { time uv sync --locked; } 2>&1 | tee results/ci/setup.log
      - name: Record selected toolchain and source identities
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --locked python scripts/ci_environment.py > results/ci/environment.json
      - name: Select source-publication verification scope
        id: scope
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          HISTORICAL_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_native }}
        run: uv run --locked python scripts/publication_ci_scope.py >> "$GITHUB_OUTPUT"
      - name: Check repository and build documentation
        run: uv run --locked python scripts/check.py 2>&1 | tee results/ci/repository-checks.log

      - name: Verify paired boundary preflight and reconstruction
        run: |
          {
            uv run --locked python -m experiments.m4.paired_observation.run \
              --output results/m4-paired/ci-reference
            uv run --locked python -S -m experiments.m4.paired_observation.run \
              --reconstruct results/m4-paired/ci-reference \
              --output results/m4-paired/reconstructed.json
            cmp results/m4-paired/ci-reference/preflight.json results/m4-paired/reconstructed.json
          } 2>&1 | tee results/ci/paired-boundary.log
      - name: Stage public documentation
        run: uv run --locked python scripts/stage_documentation.py _build/html _build/site
      - name: Preserve pull request HTML
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-pr-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/site
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1
      - name: Upload trusted main Pages artifact
        if: >-
          github.repository == 'OpenT1D/lab' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/site
          include-hidden-files: false
          retention-days: 1
      - name: Preserve public check diagnostics including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/ci/*.log
            results/ci/*.json
          if-no-files-found: warn
          retention-days: 5
      - name: Verify standalone beta-cell reference and reconstruction
        if: >-
          github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
          && steps.scope.outputs.native_enabled == 'true'
        run: |
          uv sync --locked --project experiments/m4/beta_cell/runtime
          uv run --locked --project experiments/m4/beta_cell/runtime \
            python experiments/m4/beta_cell/runtime/test_model.py
          uv run --locked --project experiments/m4/beta_cell/runtime \
            python experiments/m4/beta_cell/runtime/run.py --output results/m4/ci-reference
          uv run --locked python -S experiments/m4/beta_cell/runtime/report.py \
            results/m4/ci-reference --output results/m4/reconstructed.json
          cmp results/m4/ci-reference/report.json results/m4/reconstructed.json
      - name: Verify forward C-peptide reference and reconstruct its report
        if: >-
          github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
          && steps.scope.outputs.native_enabled == 'true'
        run: |
          uv run --locked --project experiments/m4/beta_cell/runtime \
            python -m unittest discover -s experiments/m4/c_peptide -p test_model.py -v
          uv run --locked --project experiments/m4/beta_cell/runtime \
            python -m experiments.m4.c_peptide.run --output results/m4-cpeptide/ci-reference
          uv run --locked python -S -m experiments.m4.c_peptide.report \
            results/m4-cpeptide/ci-reference --output results/m4-cpeptide/reconstructed.json
          cmp results/m4-cpeptide/ci-reference/report.json results/m4-cpeptide/reconstructed.json
      - name: Verify native insulin inlet and reconstruct its report
        if: >-
          github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
          && steps.scope.outputs.native_enabled == 'true'
        run: |
          uv sync --locked --project experiments/m0/simglucose
          uv run --locked --project experiments/m0/simglucose \
            python -m unittest discover -s experiments/m4/kinetic_inlet -p test_native.py -v
          uv run --locked --project experiments/m0/simglucose \
            python -m experiments.m4.kinetic_inlet.run \
            --secretion-run results/m4/ci-reference --output results/m4-inlet/ci-reference
          uv run --locked python -S -m experiments.m4.kinetic_inlet.report \
            results/m4-inlet/ci-reference --output results/m4-inlet/reconstructed.json
          cmp results/m4-inlet/ci-reference/report.json results/m4-inlet/reconstructed.json
      - name: Check paired baseline states against native insulin derivatives
        if: >-
          github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
          && steps.scope.outputs.native_enabled == 'true'
        run: >-
          uv run --locked --project experiments/m0/simglucose
          python -m experiments.m4.paired_observation.native_probe
          results/m4-paired/ci-reference --output results/m4-paired/native-probe.json
      - name: Verify paired kinetic execution and reconstruction
        if: >-
          github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
          && steps.scope.outputs.native_enabled == 'true'
        run: |
          uv run --locked --project experiments/m0/simglucose \
            python -m unittest experiments.m4.paired_kinetics.test_insulin -v
          uv run --locked --project experiments/m4/beta_cell/runtime \
            python -m unittest experiments.m4.paired_kinetics.test_cpeptide -v
          uv run --locked python -m experiments.m4.paired_kinetics.run \
            --boundary-run results/m4-paired/ci-reference \
            --output results/m4-paired-kinetics/ci-reference
          uv run --locked python -S -m experiments.m4.paired_kinetics.report \
            results/m4-paired-kinetics/ci-reference \
            --output results/m4-paired-kinetics/reconstructed.json
          cmp results/m4-paired-kinetics/ci-reference/report.json results/m4-paired-kinetics/reconstructed.json
      - name: Verify secretion source audit and reconstruction
        if: >-
          github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
          && steps.scope.outputs.native_enabled == 'true'
        run: |
          uv run --locked --project experiments/m4/beta_cell/runtime \
            python -m unittest experiments.m4.source_audit.test_numerical -v
          uv run --locked python -m experiments.m4.source_audit.run \
            --output results/m4-source-audit/ci-reference
          uv run --locked python -S -m experiments.m4.source_audit.run \
            --reconstruct results/m4-source-audit/ci-reference \
            --output results/m4-source-audit/reconstructed.json
          cmp results/m4-source-audit/ci-reference/report.json results/m4-source-audit/reconstructed.json
      - name: Verify prescribed glucose to paired kinetic chain
        if: >-
          github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
          && steps.scope.outputs.native_enabled == 'true'
        run: |
          uv run --locked python -m experiments.m4.chain.run \
            --output results/m4-chain/ci-reference
          uv run --locked python -S -m experiments.m4.chain.report \
            results/m4-chain/ci-reference --output results/m4-chain/reconstructed.json
          cmp results/m4-chain/ci-reference/report.json results/m4-chain/reconstructed.json
      - name: Verify feedback specification preflight without coupled trajectories
        if: >-
          github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
          && steps.scope.outputs.native_enabled == 'true'
        run: |
          uv run --locked python -m experiments.m4.feedback.preflight \
            --output results/m4-feedback-preflight/ci-reference
          uv run --locked python -S -m experiments.m4.feedback.preflight \
            --reconstruct results/m4-feedback-preflight/ci-reference \
            --output results/m4-feedback-preflight/reconstructed.json
          cmp results/m4-feedback-preflight/ci-reference/report.json results/m4-feedback-preflight/reconstructed.json
      - name: Preserve beta-cell numerical evidence including failures
        if: >-
          always() && github.event.repository.private && github.event_name == 'workflow_dispatch'
          && inputs.historical_native && steps.scope.outputs.native_enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m4-beta-cell
          path: |
            results/m4/
            results/m4-inlet/
            results/m4-cpeptide/
            results/m4-paired/
            results/m4-paired-kinetics/
            results/m4-source-audit/ci-reference/
            results/m4-source-audit/reconstructed.json
            results/m4-chain/
            results/m4-feedback-preflight/ci-reference/
            results/m4-feedback-preflight/reconstructed.json
          if-no-files-found: warn
          retention-days: 14

  public-smoke:
    name: Public smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: darwin-arm64
          - os: windows-2025
            platform: windows-amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.16'
          enable-cache: false
      - name: Install selected Python
        run: uv python install
      - name: Set up selected Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install locked root tooling
        run: uv sync --locked
      - name: Record source and tools
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p results/ci
          uv run --locked python scripts/ci_environment.py > results/ci/environment.json
      - name: Run the shared real-host smoke
        run: |
          uv run --locked python scripts/public_smoke.py --expected-platform '${{ matrix.platform }}' \
            --output results/ci/smoke.json 2>&1 | tee results/ci/smoke.log
      - name: Preserve smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-smoke-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/ci/
          if-no-files-found: warn
          retention-days: 5

  browser:
    name: Browser checks (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.browser == 'chromium' && 20 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.16'
          enable-cache: false
      - name: Install selected Python
        run: uv python install
      - name: Set up selected Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install locked root tooling
        run: uv sync --locked
      - name: Record source and tools
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p results/ci
          uv run --locked python scripts/ci_environment.py > results/ci/environment.json
      - name: Install locked browser tooling
        run: npm --prefix tests/browser ci --ignore-scripts --no-audit --no-fund
      - name: Select temporary browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/opent1d-playwright-browsers" >> "$GITHUB_ENV"
      - name: Install selected browser and its Linux dependencies
        run: npm --prefix tests/browser run install:browser -- --with-deps '${{ matrix.browser }}'
      - name: Run four Chromium MMTT flows
        if: matrix.browser == 'chromium'
        run: npm --prefix tests/browser test 2>&1 | tee results/ci/browser.log
      - name: Build and stage documentation for the project path
        run: |
          uv run --locked python scripts/check.py --stage docs
          uv run --locked python scripts/stage_documentation.py _build/html _build/documentation-preview/lab
      - name: Check all documentation pages, assets and browser behavior
        run: >-
          npm --prefix tests/browser run test:docs -- --project '${{ matrix.browser }}' --global-timeout=300000
          2>&1 | tee results/ci/documentation-browser.log
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/
            results/ci/
          if-no-files-found: warn
          retention-days: 5

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Review introduced dependency vulnerabilities
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          warn-only: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
      - name: Require complete matching dependency snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCY_CHANGES: ${{ steps.review.outputs.dependency-changes }}
        run: |
          mkdir -p results/ci
          python3 scripts/dependency_snapshot.py > results/ci/dependency-snapshot.json
      - name: Preserve dependency completeness receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/ci/dependency-snapshot.json
          if-no-files-found: warn
          retention-days: 5

  public-checks:
    name: Repository checks
    needs: [repository-checks, public-smoke, browser, dependency-review]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require every public family
        env:
          PUBLIC_CHECK_RESULTS: ${{ toJSON(needs) }}
          PUBLIC_CHECK_EVENT: ${{ github.event_name }}
        run: python3 scripts/ci_gate.py

  pages-deploy:
    name: Publish documentation
    needs: [public-checks]
    if: >-
      always() && !cancelled() && github.repository == 'OpenT1D/lab' && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.public-checks.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy checked main documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  beta-cell-feedback:
    needs: repository-checks
    if: >-
      github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
      && needs.repository-checks.outputs.native_enabled == 'true'
    name: Bounded beta-cell glucose feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.16'
          enable-cache: false
      - name: Install locked tooling and native runtime
        run: |
          uv sync --locked
          uv sync --locked --project experiments/m0/simglucose
      - name: Verify source, coupled boundary and terminal failures
        run: >-
          uv run --locked --project experiments/m0/simglucose
          python -m unittest experiments.m4.feedback.test_numerical -v
      - name: Execute frozen feedback matrix and fresh-process repeat
        run: >-
          uv run --locked python -m experiments.m4.feedback.run
          --output results/m4-feedback/ci-reference
      - name: Reconstruct without numerical packages
        run: |
          uv run --locked python -S -m experiments.m4.feedback.report \
            results/m4-feedback/ci-reference --output results/m4-feedback/reconstructed.json
          cmp results/m4-feedback/ci-reference/report.json results/m4-feedback/reconstructed.json
      - name: Verify hepatic relations, conservation and terminal extraction failure
        run: >-
          uv run --locked --project experiments/m0/simglucose
          python -m unittest experiments.m4.hepatic.test_numerical -v
      - name: Execute and reconstruct the hepatic structural comparison
        run: |
          uv run --locked python -m experiments.m4.hepatic.run \
            --output results/m4-hepatic/ci-reference
          uv run --locked python -S -m experiments.m4.hepatic.report \
            results/m4-hepatic/ci-reference --output results/m4-hepatic/reconstructed.json
          cmp results/m4-hepatic/ci-reference/report.json results/m4-hepatic/reconstructed.json
      - name: Verify the separate C-peptide observation runtime
        run: |
          uv sync --locked --project experiments/m4/beta_cell/runtime
          uv run --locked --project experiments/m4/beta_cell/runtime \
            python -m unittest experiments.m4.feedback_observation.test_numerical -v
      - name: Verify configured researcher C-peptide numerics
        run: >-
          uv run --locked --project experiments/m4/beta_cell/runtime
          python -m unittest experiments.m4.researcher_workflow.test_numerical -v
      - name: Observe the checked feedback source and reconstruct the report
        run: |
          uv run --locked python -m experiments.m4.feedback_observation.run \
            --source results/m4-hepatic/ci-reference --output results/m4-feedback-observation/ci-reference
          uv run --locked python -S -m experiments.m4.feedback_observation.report \
            results/m4-feedback-observation/ci-reference --output results/m4-feedback-observation/reconstructed.json
          cmp results/m4-feedback-observation/ci-reference/report.json \
            results/m4-feedback-observation/reconstructed.json
      - name: Run configured M4 through the local entry and reconstruct all reports
        run: >-
          uv run --locked python -S -m experiments.workflow_acceptance
          --task m4-secretion
          --m4-reference results/m4-feedback/ci-reference
          --output results/m4-researcher-entry/ci-acceptance
      - name: Compare frozen M4 sources through the local entry and reconstruct
        run: |
          uv run --locked python -S -m experiments.workflows run m4-compare \
            --config experiments/m4/comparison/example.json \
            --reference results/m4-feedback/ci-reference \
            --output results/m4-comparison/ci-reference
          uv run --locked python -S -m experiments.workflows reconstruct m4-compare \
            --archive results/m4-comparison/ci-reference \
            --output results/m4-comparison/ci-reconstructed
          cmp results/m4-comparison/ci-reference/report.json results/m4-comparison/ci-reconstructed/report.json
          cmp results/m4-comparison/ci-reference/report.md results/m4-comparison/ci-reconstructed/report.md
          cmp results/m4-comparison/ci-reference/figure.svg results/m4-comparison/ci-reconstructed/figure.svg
      - name: Preserve feedback evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m4-feedback
          path: |
            results/m4-feedback/
            results/m4-hepatic/
            results/m4-feedback-observation/
            results/m4-researcher-entry/
            results/m4-comparison/
          if-no-files-found: warn
          retention-days: 14

  configurable-study-tools:
    needs: repository-checks
    if: >-
      github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
      && needs.repository-checks.outputs.native_enabled == 'true'
    name: Configurable M4 study and local research tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.16'
          enable-cache: false
      - name: Install locked tooling and task-directed numerical environments
        run: |
          uv sync --locked
          uv run --locked python -S -m experiments.setup plan m4-study \
            --output results/m4-study-tools/setup-plan
          uv run --locked python -S -m experiments.setup install \
            --plan results/m4-study-tools/setup-plan --output results/m4-study-tools/setup-install
          uv run --locked python -S -m experiments.setup check \
            --plan results/m4-study-tools/setup-plan --output results/m4-study-tools/setup-check
      - name: Verify midpoint numerics and inherited terminal gates
        run: >-
          uv run --locked --project experiments/m0/simglucose
          python -m unittest experiments.m4.initial_load.test_numerical -v
      - name: Prepare the explicit fasting campaign and catalogue pointers
        run: |
          uv run --locked python -S - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          output = root / "results/m4-study-tools"
          inputs = output / "inputs"
          inputs.mkdir(parents=True)
          example = root / "experiments/m4/initial_load/example.json"
          config = json.loads(example.read_text())
          for source in config["sources"]:
              for key in ("model", "declaration"):
                  source[key] = str((example.parent / source[key]).resolve())
          config["scenarios"] = ["fasting"]
          (inputs / "study.json").write_text(json.dumps(config, indent=2) + "\n")
          campaign = {
              "schema": "opent1d.local-campaign-config/1",
              "task": "m4-study",
              "cells": [{"id": "fasting", "config": "study.json"}],
              "repeats": 2,
              "timeout_seconds": 1200,
          }
          (inputs / "campaign.json").write_text(json.dumps(campaign, indent=2) + "\n")
          entries = [{"id": "full-study", "archive": "study"}]
          for repeat in (1, 2):
              entries.append({
                  "id": f"fasting-repeat-{repeat}",
                  "archive": f"campaign/sessions/session-0001/attempts/fasting--r{repeat:03d}/archive",
              })
          request = {
              "schema": "opent1d.catalogue-request/1",
              "entries": [
                  {"id": item["id"], "task": "m4-study", "archive": str(output / item["archive"]), "tags": ["ci"]}
                  for item in entries
              ],
          }
          (inputs / "catalogue.json").write_text(json.dumps(request, indent=2) + "\n")
          PY
      - name: Run the full configurable study through the local entry
        run: >-
          uv run --locked python -S -m experiments.workflows run m4-study
          --config experiments/m4/initial_load/example.json --output results/m4-study-tools/study
      - name: Reconstruct the study without numerical packages
        run: |
          uv run --locked python -S -m experiments.workflows reconstruct m4-study \
            --archive results/m4-study-tools/study --output results/m4-study-tools/study-reconstructed
          cmp results/m4-study-tools/study/report.json results/m4-study-tools/study-reconstructed/report.json
          cmp results/m4-study-tools/study/report.md results/m4-study-tools/study-reconstructed/report.md
          cmp results/m4-study-tools/study/figure.svg results/m4-study-tools/study-reconstructed/figure.svg
      - name: Execute both campaign repetitions and verify accepted-slot reuse
        run: |
          uv run --locked python -S -m experiments.campaigns check \
            --config results/m4-study-tools/inputs/campaign.json
          uv run --locked python -S -m experiments.campaigns run \
            --config results/m4-study-tools/inputs/campaign.json --output results/m4-study-tools/campaign
          uv run --locked python -S -m experiments.campaigns resume \
            --campaign results/m4-study-tools/campaign
          uv run --locked python -S -m experiments.campaigns reconstruct \
            --campaign results/m4-study-tools/campaign --output results/m4-study-tools/campaign-reconstructed
          cmp results/m4-study-tools/campaign/sessions/session-0002/report.json \
            results/m4-study-tools/campaign-reconstructed/report.json
          cmp results/m4-study-tools/campaign/sessions/session-0002/report.md \
            results/m4-study-tools/campaign-reconstructed/report.md
          uv run --locked python -S - <<'PY'
          import json
          from pathlib import Path

          campaign = Path("results/m4-study-tools/campaign")
          report = json.loads((campaign / "sessions/session-0002/report.json").read_text())
          assert report["passed"] and report["accepted_slots"] == report["planned_slots"] == 2
          assert report["accepted_source_scenarios"] == report["planned_source_scenarios"] == 4
          assert [session["scheduled_slots"] for session in report["sessions"]] == [2, 0]
          assert all(len(slot["attempts"]) == 1 for slot in report["slots"])
          PY
      - name: Index and verify native archives and compare the two exact repeats
        run: |
          uv run --locked python -S -m experiments.catalogue index \
            --config results/m4-study-tools/inputs/catalogue.json --output results/m4-study-tools/catalogue
          uv run --locked python -S -m experiments.catalogue verify \
            --catalogue results/m4-study-tools/catalogue --output results/m4-study-tools/catalogue-verified
          uv run --locked python -S -m experiments.catalogue list \
            --catalogue results/m4-study-tools/catalogue-verified --task m4-study --tag ci
          uv run --locked python -S -m experiments.catalogue compare \
            --catalogue results/m4-study-tools/catalogue-verified \
            --left fasting-repeat-1 --right fasting-repeat-2
      - name: Preserve study, setup, campaign and catalogue evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m4-study-tools
          path: results/m4-study-tools/
          if-no-files-found: warn
          retention-days: 14

