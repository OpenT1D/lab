          uv sync --locked --project experiments/literature/lit001/runtime
          npm --prefix experiments/m0/lt1 ci --ignore-scripts --no-audit --no-fund
          node experiments/m0/lt1/setup.mjs
      - name: Reconstruct recorded literature screening from a clean output path
        run: |
          uv run --locked python -m experiments.literature.lit001.compile \
            --output results/lit002/screening-reconstructed.json
          cmp results/lit002/screening-reconstructed.json experiments/literature/lit001/screening-final.json
