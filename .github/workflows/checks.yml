            --thresholds results/verification/thresholds.json --output results/verification/numerical
          uv run --locked python -S -m experiments.verification.campaign report \
            --study results/verification/numerical --output results/verification/reconstructed.json
          cmp results/verification/numerical/report.json results/verification/reconstructed.json
