          -p test_model.py -v
      - name: Verify the unchanged native baseline and absorption boundary
        env:
          TS_NODE_PROJECT: experiments/m0/lt1/tsconfig.json
        run: >-
          node --loader ./experiments/m0/lt1/node_modules/ts-node/esm.mjs
          --test experiments/literature/lit002/native/test-native.mjs
      - name: Execute all frozen synthetic cases and refinements
        run: uv run --locked python -m experiments.literature.lit002 run --output results/lit002/study
      - name: Reconstruct without native or scientific runtime imports
        run: |
          uv run --locked python -S -m experiments.literature.lit002 report \
