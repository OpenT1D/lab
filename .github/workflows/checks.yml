    if: >-
      github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
      && needs.repository-checks.outputs.native_enabled == 'true'
    name: M3 causal forecasting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.16'
          enable-cache: false
      - name: Install separate locked tooling and estimator
        run: |
          uv sync --locked
          uv sync --locked --project experiments/m3/runtime
      - name: Verify native estimator, weighting and development-only fitting
        run: >-
          uv run --locked --project experiments/m3/runtime python -m unittest discover
          -s experiments/m3 -p test_native.py -v
      - name: Freeze, execute and reconstruct synthetic forecasts
        run: uv run --locked python -m experiments.m3.verify --output results/m3/verification
      - name: Verify the separate AZT1D study and access boundaries
        run: |
          uv run --locked --project experiments/m3/runtime python -m unittest discover \
            -s experiments/m3/azt1d -p test_native.py -v
          uv run --locked python -m experiments.m3.azt1d.verify --output results/m3/azt1d-verification
      - name: Verify frozen-model transfer without external refitting
        run: uv run --locked python -m experiments.m3.external.verify --output results/m3/external-verification
      - name: Verify researcher forecast intake and source-free reconstruction
        run: >-
          uv run --locked python -m experiments.m3.researcher verify
          --output results/m3/researcher-verification
      - name: Verify synthetic PhysioCGM-format preparation without evaluation
        run: |
          uv run --locked python -m experiments.m3.physiocgm fixture --output results/m3/physiocgm-fixture
          uv run --locked python -m experiments.m3.physiocgm prepare \
            --request results/m3/physiocgm-fixture/request.json --output results/m3/physiocgm-converted
          uv run --locked python -S -m experiments.m3.physiocgm verify --bundle results/m3/physiocgm-converted
      - name: Preserve synthetic M3 evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-forecast
          path: results/m3/
