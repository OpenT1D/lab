  c1-patched-checkpoint-boundary:
    needs: repository-checks
    if: >-
      github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.historical_native
      && needs.repository-checks.outputs.native_enabled == 'true'
    name: Patched C1 checkpoint and synthetic actor boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select the temporary actor-source directory at runtime
        run: printf '%s\n' "G2P2C_SOURCE=$RUNNER_TEMP/g2p2c-source" >> "$GITHUB_ENV"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.16'
          enable-cache: false
      - name: Install both patched C1 locked runtimes
        run: |
          uv sync --locked --project experiments/c1/g2p2c_policy_source
          uv sync --locked --project experiments/c1/g2p2c_training_source
      - name: Fetch the pinned public actor source without trained weights
        run: |
          git init "$G2P2C_SOURCE"
          git -C "$G2P2C_SOURCE" remote add origin https://github.com/RL4H/G2P2C.git
          git -C "$G2P2C_SOURCE" fetch --depth 1 origin 37f7b7e161e9c1e7b702c8eebdc5cc7eb4f81d70
          git -C "$G2P2C_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$G2P2C_SOURCE" rev-parse HEAD)" = 37f7b7e161e9c1e7b702c8eebdc5cc7eb4f81d70
      - name: Refuse unsafe checkpoints in the policy runtime
        run: |
          mkdir -p results/c1-checkpoint-ci
          uv run --locked --project experiments/c1/g2p2c_policy_source \
            python -B -m unittest tests.test_c1_g2p2c_checkpoint -v \
            2>&1 | tee results/c1-checkpoint-ci/policy-checkpoint.log
      - name: Refuse unsafe checkpoints in the training runtime
        run: |
          uv run --locked --project experiments/c1/g2p2c_training_source \
            python -B -m unittest tests.test_c1_g2p2c_checkpoint -v \
            2>&1 | tee results/c1-checkpoint-ci/training-checkpoint.log
      # The trusted historical checkpoint/attempt/native bundles are local inputs,
      # so CI checks random initialization, not the full trained native gate.
      - name: Check synthetic source actor parity and fresh-process repeats
        run: |
          uv run --locked --project experiments/c1/g2p2c_policy_source \
            python -B -m experiments.c1.g2p2c_actor_source_probe \
            --source "$G2P2C_SOURCE" --output results/c1-checkpoint-ci/policy-primary.json
          uv run --locked --project experiments/c1/g2p2c_policy_source \
            python -B -m experiments.c1.g2p2c_actor_source_probe \
            --source "$G2P2C_SOURCE" --output results/c1-checkpoint-ci/policy-repeat.json
          uv run --locked --project experiments/c1/g2p2c_training_source \
            python -B -m experiments.c1.g2p2c_actor_source_probe \
            --source "$G2P2C_SOURCE" --output results/c1-checkpoint-ci/training-primary.json
          uv run --locked --project experiments/c1/g2p2c_training_source \
            python -B -m experiments.c1.g2p2c_actor_source_probe \
            --source "$G2P2C_SOURCE" --output results/c1-checkpoint-ci/training-repeat.json
          cmp results/c1-checkpoint-ci/policy-primary.json results/c1-checkpoint-ci/policy-repeat.json
          cmp results/c1-checkpoint-ci/training-primary.json results/c1-checkpoint-ci/training-repeat.json
          cmp results/c1-checkpoint-ci/policy-primary.json results/c1-checkpoint-ci/training-primary.json
      - name: Preserve checkpoint and synthetic actor evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c1-checkpoint-ci
          path: results/c1-checkpoint-ci/
          if-no-files-found: warn
          retention-days: 14

