          report = json.loads(Path("results/m4-maintained-ci/reconstructed/report.json").read_text())
          assert report["schema"] == "m4-secure-study-report/1" and report["passed"]
          assert report["configuration"]["scenarios"] == ["fasting", "gastric_load_15g", "gastric_load_30g"]
          assert report["reference"]["accepted"] and report["common_controls"]["passed"]
