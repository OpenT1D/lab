name: External link review

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-link-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Review external links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.11.16'
          enable-cache: false
      - name: Install locked repository tooling
        run: uv sync --locked
      - name: Check external links
        run: uv run --locked sphinx-build -E -a -b linkcheck -c docs . _build/linkcheck
      - name: Show link report
        if: always()
        run: |
          if [ -f _build/linkcheck/output.txt ]; then
            cat _build/linkcheck/output.txt
          fi
