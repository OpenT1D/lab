# Reviewed installed M4 candidate; historical project files remain frozen.
[project]
name = "opent1d-installed-m4-native-runtime"
version = "0.0.0.dev0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "simglucose",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.3",
    "matplotlib==3.9.4",
    "setuptools==84.2.1",
    "urllib3==2.8.0",
    "glucosim",
    "certifi==2026.10.23",
    "pillow==13.0.0",
]

[tool.uv]
package = false
required-version = ">=0.11.16"
build-constraint-dependencies = [
    "setuptools==84.2.1", "wheel==0.46.2", "packaging==26.3",
    "hatchling==1.32.4", "pathspec==1.1.1", "pluggy==1.7.0",
    "tomlkit==0.15.2", "trove-classifiers==2026.9.21.13",
]

[tool.uv.sources]
simglucose = { git = "https://github.com/jxx123/simglucose", rev = "a6f6777586c860457a2a1e6cce6d0bd3fd33d1cc" }
glucosim = { git = "https://github.com/HassDhia/glucosim", rev = "6422a91d533125a8feb4f2e8737aecd67fec95c9" }
